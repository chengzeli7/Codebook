# Gradle JVM 参数
# 1. 适当提高内存上限，避免 kapt 生成 stub 时 OOM
# 2. JDK 17+ 需要以下 --add-opens 才能运行 kapt；Gradle 不支持反斜杠续行，参数必须写在同一行
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

kapt.use.worker.api=true
kapt.incremental.apt=true
kapt.include.compile.classpath=false

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.cache.kind=none
